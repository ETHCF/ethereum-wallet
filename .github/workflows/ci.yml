name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps the e2e runs from hanging the whole workflow on a flake.
  ECF_WALLET_E2E_RETRY_LIMIT: 2

# The jobs only read the repository. Anything more must be granted per job.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn verify-locales --quiet
      - run: yarn lint:lockfile
      - run: yarn lint:shellcheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn test:unit
      - run: yarn test:unit:global

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # The committed LavaMoat policies must be the ones this code and a clean
      # install of the lockfile produce, or the build would sandbox with stale
      # permissions.
      - run: yarn lavamoat:policy
      - name: Check the LavaMoat policies are up to date
        run: |
          if [ -n "$(git status --porcelain -- lavamoat)" ]; then
            git status --short -- lavamoat
            git diff -- lavamoat
            echo "::error::The LavaMoat policies are out of date. Run 'yarn lavamoat:policy' after a clean 'yarn install --frozen-lockfile', review the changes and commit them."
            exit 1
          fi
      - run: yarn dist
      # The hash the About screen shows must match what was built.
      - run: yarn verify-build
      - run: yarn validate-source-maps
      - run: yarn verify-service-worker
      - run: yarn mozilla-lint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-builds
          path: builds/
          retention-days: 7

  e2e-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn build:test
      - name: Run the Chrome end-to-end suite
        run: yarn test:e2e:chrome
        env:
          SELENIUM_BROWSER: chrome
          SELENIUM_HEADLESS: 'true'
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts-chrome
          path: test-artifacts/
          retention-days: 7

  # The runner image ships Firefox and geckodriver.
  e2e-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn build:test
      - name: Run the Firefox end-to-end suite
        run: yarn test:e2e:firefox
        env:
          SELENIUM_BROWSER: firefox
          SELENIUM_HEADLESS: 'true'
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts-firefox
          path: test-artifacts/
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Pin yarn
        run: npm install --global yarn@1.22.22
      # yarn 1 audits the lockfile; nothing needs installing. Its exit status
      # is a bitmask of the severities found (8 high, 16 critical) whatever
      # --level shows, so test those bits rather than the status.
      - name: Audit production dependencies
        run: |
          status=0
          yarn audit --groups dependencies --level high || status=$?
          if [ $((status & 24)) -ne 0 ]; then
            echo "::error::High or critical vulnerabilities in production dependencies."
            exit 1
          fi

  all-tests-pass:
    runs-on: ubuntu-latest
    needs: [lint, unit, build, e2e-chrome, e2e-firefox, dependency-audit]
    # Run even when a job above fails: a skipped required check counts as
    # passing, so this job has to fail instead.
    if: always()
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
          echo "All required checks passed."
