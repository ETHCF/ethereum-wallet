name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps the e2e runs from hanging the whole workflow on a flake.
  ECF_WALLET_E2E_RETRY_LIMIT: 2

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn verify-locales --quiet
      - run: yarn lint:lockfile
      - run: yarn lint:shellcheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test:unit
      - run: yarn test:unit:global

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn dist
      # The hash the About screen shows must match what was built.
      - run: yarn verify-build
      - run: yarn validate-source-maps
      - run: yarn verify-service-worker
      - run: yarn mozilla-lint
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: builds/
          retention-days: 7

  e2e-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn build:test
      - name: Run the Chrome end-to-end suite
        run: yarn test:e2e:chrome
        env:
          SELENIUM_BROWSER: chrome
          SELENIUM_HEADLESS: 'true'
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test-artifacts/
          retention-days: 7

  all-tests-pass:
    runs-on: ubuntu-latest
    needs: [lint, unit, build, e2e-chrome]
    steps:
      - run: echo "All required checks passed."
