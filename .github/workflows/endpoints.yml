name: Endpoint health

# Not part of CI: these are third-party hosts, and a pull request should not
# fail because one of them is having a bad day. A daily run surfaces a dead
# endpoint before a user does.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# The jobs only read the repository. Anything more must be granted per job.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn check-endpoints
